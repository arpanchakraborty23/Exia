[project]
name = "exia-backend"
version = "1.0.0"
description = "Exia — FastAPI Server Gateway for UI Clients (Web, Desktop, Mobile), LiveKit WebRTC & MongoDB Atlas"
readme = "backend/README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Arpan Chakraborty", email = "arpanchakraborty500@gmail.com" }
]
keywords = [
    "exia",
    "fastapi",
    "livekit",
    "webrtc",
    "mongodb",
    "mcp",
    "voice-agent",
    "ai-assistant",
    "vercel"
]
dependencies = [
    "bcrypt>=4.0.1",
    "fastapi>=0.141.1",
    "fastmcp>=4.0.3",
    "livekit>=1.1.18",
    "livekit-api>=1.2.1",
    "passlib>=1.7.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.14.0",
    "pymongo>=4.18.1",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[tool.vercel]
entrypoint = "backend.main:app"
