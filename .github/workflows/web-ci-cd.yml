name: Exia Web — CI/CD & GitHub Pages Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deployment / Output Target'
        required: true
        default: 'github-pages'
        type: choice
        options:
          - 'github-pages'
          - 'artifact-only'
      run_validation:
        description: 'Run Typecheck and Tests before building'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Code & Tests
    if: github.event_name != 'workflow_dispatch' || inputs.run_validation == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'ui/pnpm-lock.yaml'

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript Check
        run: pnpm -r run typecheck

      - name: Run Vitest Unit Tests
        run: pnpm test

  build-universal-web:
    name: Build Universal Web Client (Expo Web)
    needs: [validate]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'ui/pnpm-lock.yaml'

      - name: Install Workspace Dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Compile Expo Web Production Export
        working-directory: ui
        env:
          EXPO_BASE_URL: /Exia
          EXPO_PUBLIC_API_URL: https://exia-backend.vercel.app/api
        run: pnpm web:build

      - name: Prepare GitHub Pages Static Assets (.nojekyll & 404 fallback)
        run: |
          test -f ui/apps/mobile/dist/index.html || { echo "index.html not found!"; exit 1; }
          # Bypass Jekyll processing so _expo folders are served
          touch ui/apps/mobile/dist/.nojekyll
          # Copy index.html to 404.html for client-side SPA routing
          cp ui/apps/mobile/dist/index.html ui/apps/mobile/dist/404.html
          echo "Web export verified successfully. Total files:"
          find ui/apps/mobile/dist -type f | wc -l

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: exia-web-production
          path: ui/apps/mobile/dist/
          retention-days: 30

      - name: Setup GitHub Pages
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_target != 'artifact-only')
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_target != 'artifact-only')
        uses: actions/upload-pages-artifact@v3
        with:
          path: ui/apps/mobile/dist

      - name: Generate Step Summary
        run: |
          echo "### 🌐 Universal Web Client Export Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Framework** | Expo SDK 58 · React Native Web · React 19 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target URL** | https://arpanchakraborty23.github.io/Exia/ |" >> $GITHUB_STEP_SUMMARY
          echo "| **Base URL** | \`/Exia\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend API** | \`https://exia-backend.vercel.app/api\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Output Directory** | \`ui/apps/mobile/dist\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **SPA Routing** | \`404.html\` & \`.nojekyll\` included |" >> $GITHUB_STEP_SUMMARY

  deploy-pages:
    name: Deploy to GitHub Pages
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_target != 'artifact-only')
    needs: [build-universal-web]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
