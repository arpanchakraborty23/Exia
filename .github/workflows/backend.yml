name: Exia Backend — Vercel CI/CD Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_BACKEND_ORG_ID || secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate Backend Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python Sources
        run: python -m compileall -q main.py src

  deploy-production:
    name: Deploy Backend Production to Vercel
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_BACKEND_TOKEN || secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Vercel Secrets
        run: |
          test -n "$VERCEL_TOKEN" || { echo "::error::Set VERCEL_BACKEND_TOKEN (or VERCEL_TOKEN) in GitHub Actions secrets"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "::error::Set VERCEL_BACKEND_ORG_ID (or VERCEL_ORG_ID) in GitHub Actions secrets"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::Set VERCEL_BACKEND_PROJECT_ID (or VERCEL_PROJECT_ID) in GitHub Actions secrets"; exit 1; }

      - name: Install Vercel CLI
        run: npm install --global vercel@65.9.0

      - name: Pull Vercel Environment (Production)
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy and Build on Vercel (Production)
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --yes --prod --token="$VERCEL_TOKEN")
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "Production Deployment URL: $DEPLOYMENT_URL"

      - name: Write Deployment Summary
        run: |
          echo "### 🚀 Exia Backend Deployed Successfully to Vercel!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Production" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment URL**: ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
