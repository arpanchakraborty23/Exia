name: Exia Desktop — Windows EXE Build

on:
  push:
    branches:
      - main
    paths:
      - 'ui/**'
      - 'desktop/**'
      - '.github/workflows/desktop-ci-cd.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ui/**'
      - 'desktop/**'
      - '.github/workflows/desktop-ci-cd.yml'
  workflow_dispatch:
    inputs:
      target_format:
        description: 'Target Packaging Format'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'portable'
          - 'nsis'
      run_validation:
        description: 'Run Typecheck and Tests before building'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  validate:
    name: Validate Code & Tests
    if: github.event_name != 'workflow_dispatch' || inputs.run_validation == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'ui/pnpm-lock.yaml'

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript Check
        run: pnpm -r run typecheck

      - name: Run Vitest Unit Tests
        run: pnpm test

  build-windows-exe:
    name: Build Windows EXE on GitHub Runner
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [validate]
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'ui/pnpm-lock.yaml'

      - name: Install UI Monorepo Dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Compile Expo Web Production Export
        working-directory: ui
        run: pnpm web:build

      - name: Synchronize Web Export to Desktop Shell
        working-directory: desktop
        run: node scripts/sync-dist.js

      - name: Install Desktop Electron Dependencies
        working-directory: desktop
        run: npm install

      - name: Package Windows Executable (electron-builder)
        working-directory: desktop
        run: |
          if ("${{ inputs.target_format }}" -eq "portable") {
            npx electron-builder --win portable --publish never
          } elseif ("${{ inputs.target_format }}" -eq "nsis") {
            npx electron-builder --win nsis --publish never
          } else {
            npx electron-builder --win --publish never
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-output
          Copy-Item -Path "desktop/dist-electron/*.exe" -Destination "build-output"
          Get-ChildItem -Path "build-output"

      - name: Upload Windows Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exia-windows-desktop-exe
          path: build-output/*.exe
          retention-days: 30

      - name: Generate Step Summary
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### 💻 Windows Desktop .EXE Build Completed Successfully!"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Property | Value |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "|---|---|"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| **Platform** | Windows x64 |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| **Artifact Name** | \`exia-windows-desktop-exe\` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| **Retention** | 30 days |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "📥 **How to download and run:**"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "1. Scroll down to the **Artifacts** table at the bottom of this summary."
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "2. Download \`exia-windows-desktop-exe\` (ZIP)."
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "3. Extract the ZIP and double-click to install (\`Exia Setup.exe\`) or run portable (\`Exia-portable.exe\`) directly!"
